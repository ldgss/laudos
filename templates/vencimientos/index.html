{% extends "base/base.html" %}

{% block header %}
{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <th>Producto</th>
                    <th>Meses</th>
                    <th>Última modificación</th>
                </thead>
                <tbody>
                    {% for v in vencimientos %}
                        <tr>
                            <td> {{ v.producto }} </td>
                            <td> {{ v.meses }} </td>
                            <td> {{ v.ultima_actualizacion.strftime('%Y-%m-%d %H:%M') }} </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
