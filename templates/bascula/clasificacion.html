{% extends "base/base.html" %}

{% block header %}
    <script defer src="{{url_for("static", filename="js/bascula/utils.js")}}"></script>
    <script defer src="{{url_for("static", filename="js/bascula/clasificacion.js")}}"></script>
{% endblock %}

{% block content %}

<form id="form_agregar" action="clasificar" method="post">

    <div class="row m-4 justify-content-center">
        <label for="ipm" class="col-sm-2 col-form-label">Ipm</label>
        <div class="col-sm-5">
            <input required type="number" min="0" max="999999" maxlength="6" class="form-control" name="ipm" id="ipm">
        </div>
    </div>

    <div class="row m-4 justify-content-center">
        <div class="col-sm-2">
            <div onclick="pesar()" class="btn btn-warning">
                Pesar
                <div id="spinner" style="display: none;" class="spinner-border spinner-border-sm text-white" role="status"></div>
            </div>
        </div>
        <div class="col-sm-5">
            <input required type="number" min="0" max="999999" maxlength="6" class="form-control" name="peso" id="peso">
        </div>
    </div>

    <!-- SECCIÓN DE CÁMARA Y SELECCIÓN DE REGIÓN -->
    <div class="row m-4 justify-content-center">
        <label class="col-sm-2 col-form-label">Zona de Tomates</label>
        <div class="col-sm-5">
            <!-- Contenedor cuadrado adaptable -->
            <div class="position-relative w-100 bg-dark rounded overflow-hidden shadow-sm" style="aspect-ratio: 1 / 1;">
                <video id="webcam" autoplay playsinline class="w-100 h-100" style="display:none;"></video>
                <canvas id="canvas-dibujo" class="w-100 h-100" style="cursor: crosshair;"></canvas>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mt-2">
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="reiniciarPuntos()">Borrar Dibujo</button>
                <small class="text-muted">Haz clic para marcar los vértices</small>
            </div>

            <!-- Inputs ocultos para coordenadas e imagen -->
            <input type="hidden" name="coordenadas" id="coordenadas" required>
            <input type="hidden" name="image_data" id="image_data" required>
        </div>
    </div>

    <div class="row m-4 justify-content-center">
        <label for="observaciones" class="col-sm-2 col-form-label">Observaciones</label>
        <div class="col-sm-5">
            <textarea class="form-control" id="observaciones" name="observaciones" 
            rows="4" maxlength="1000" placeholder="Ingrese observaciones"></textarea>
        </div>
    </div>

    <div class="row m-4 justify-content-center">
        <div class="m-2 text-center">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="javascript:void(0);" class="btn btn-secondary" onclick="boton_volver()">Volver</a>
        </div>
    </div>
</form>

{% endblock %}
