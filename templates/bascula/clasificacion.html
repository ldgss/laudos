{% extends "base/base.html" %}

{% block header %}
    <script defer src="{{url_for("static", filename="js/bascula/utils.js")}}"></script>
    <script defer src="{{url_for("static", filename="js/bascula/clasificacion.js")}}"></script>
{% endblock %}

{% block content %}

<form id="form_agregar" action="clasificacion_guardar" method="post">

    <div class="row m-4 justify-content-center">
        <label for="ipm" class="col-sm-2 col-form-label">Ipm</label>
        <div class="col-sm-5">
            <input required type="number" min="0" max="999999" maxlength="6" class="form-control" name="ipm" id="ipm">
        </div>
    </div>

    <div class="row m-4 justify-content-center">
        <div class="col-sm-2">
            <div onclick="pesar()" class="btn btn-warning">
                Pesar
                <div id="spinner" style="display: none;" class="spinner-border spinner-border-sm text-white" role="status"></div>
            </div>
        </div>
        <div class="col-sm-5">
            <input required type="number" min="0" max="999999" maxlength="6" class="form-control" name="peso" id="peso">
        </div>
    </div>

    <!-- NUEVO: SELECTOR DE FUENTE DE IMAGEN -->
    <div class="row m-4 justify-content-center">
        <label for="fuente-imagen" class="col-sm-2 col-form-label">Fuente de Imagen</label>
        <div class="col-sm-5">
            <select id="fuente-imagen" class="form-select" onchange="cambiarFuenteImagen()">
                <option value="webcam">Webcam del dispositivo</option>
                <option value="dahua">Cámara IP Dahua</option>
                <option value="archivo">Subir imagen desde archivo</option>
            </select>
            <!-- Input oculto para cuando eligen subir archivo -->
            <input type="file" id="input-archivo" accept="image/*" class="form-control mt-2" style="display: none;" onchange="cargarImagenArchivo(event)">
        </div>
    </div>

    <!-- SECCIÓN DE CÁMARA Y SELECCIÓN DE REGIÓN -->
    <div class="row m-4 justify-content-center">
        <label class="col-sm-2 col-form-label">Zona de Tomates</label>
        <div class="col-sm-5">
            
            <div class="position-relative w-100 bg-dark rounded overflow-hidden shadow-sm"
                style="aspect-ratio: 4 / 3;">

                <video id="webcam"
                    autoplay
                    playsinline
                    muted
                    style="display: none;">
                </video>

                <canvas id="canvas-dibujo"
                        class="position-absolute top-0 start-0 w-100 h-100"
                        style="cursor: crosshair; object-fit: contain;">
                </canvas>

            </div>
            
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div>
                    <button type="button" class="btn btn-sm btn-outline-danger me-2" onclick="reiniciarPuntos()">Borrar Dibujo</button>
                    <!-- NUEVO BOTÓN DE ANÁLISIS AJAX -->
                    <button type="button" class="btn btn-sm btn-success" onclick="analizarMuestra()">Analizar Muestra</button>
                </div>
                <small class="text-muted">Haz clic para marcar los vértices</small>
            </div>

            <!-- CONTENEDOR DE MUESTRAS ACUMULADAS -->
            <div id="contenedor-muestras" class="mt-3"></div>

            <!-- Input oculto para enviar todas las muestras en formato JSON al backend -->
            <input type="hidden" name="muestras_json" id="muestras_json">
        </div>
    </div>

    <div class="row m-4 justify-content-center">
        <label for="observaciones" class="col-sm-2 col-form-label">Observaciones</label>
        <div class="col-sm-5">
            <textarea class="form-control" id="observaciones" name="observaciones" 
            rows="4" maxlength="1000" placeholder="Ingrese observaciones"></textarea>
        </div>
    </div>

    <div class="row m-4 justify-content-center">
        <div class="m-2 text-center">
            <button type="submit" class="btn btn-primary">Guardar Lote Completo</button>
            <a href="javascript:void(0);" class="btn btn-secondary" onclick="boton_volver()">Volver</a>
        </div>
    </div>
</form>

{% endblock %}
